name: Update ClawHub download badge

on:
  schedule:
    - cron: "0 6 * * *"   # Daily at 6 AM ET
  workflow_dispatch:       # Allow manual trigger

permissions:
  contents: write

jobs:
  update-badge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch download counts from ClawHub
        run: |
          # Fetch stats for both skills
          ROBINHOOD=$(curl -s https://clawhub.ai/api/v1/skills/robinhood-agentic)
          SOUNDCLOUD=$(curl -s https://clawhub.ai/api/v1/skills/soundcloud)

          # Extract download counts using jq
          ROBINHOOD_DL=$(echo "$ROBINHOOD" | jq '.skill.stats.downloads // 0')
          SOUNDCLOUD_DL=$(echo "$SOUNDCLOUD" | jq '.skill.stats.downloads // 0')

          TOTAL=$((ROBINHOOD_DL + SOUNDCLOUD_DL))

          echo "robinhood-agentic: $ROBINHOOD_DL"
          echo "soundcloud: $SOUNDCLOUD_DL"
          echo "total: $TOTAL"

          # Write shields.io endpoint badge JSON
          mkdir -p badges
          jq -n \
            --arg msg "$TOTAL" \
            '{schemaVersion: 1, label: "total ClawHub downloads", message: $msg, color: "blue"}' \
            > badges/total-downloads.json

          cat badges/total-downloads.json

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add badges/total-downloads.json
          if ! git diff --cached --quiet; then
            git commit -m "Update ClawHub total download badge"
            git push
          else
            echo "No change — badge already up to date"
          fi
